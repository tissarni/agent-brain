name: publish-guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  audit:
    if: startsWith(github.repository, 'tissarni/agent-brain')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH_GUARD_WHERE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write the list
        id: list
        env:
          LIST: ${{ secrets.PUBLISH_GUARD_LIST }}
        run: |
          if [ -z "$LIST" ]; then
            echo "publish-guard audit skipped: PUBLISH_GUARD_LIST is not set"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$LIST" > "$RUNNER_TEMP/publish-guard.patterns"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: History, every ref
        if: steps.list.outputs.enabled == 'true'
        run: |
          export PUBLISH_GUARD_PATTERNS="$RUNNER_TEMP/publish-guard.patterns"
          ./publish-guard.sh history .
      - name: GitHub texts
        if: steps.list.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PUBLISH_GUARD_PATTERNS="$RUNNER_TEMP/publish-guard.patterns"
          ./publish-guard.sh github "$GITHUB_REPOSITORY"
